name: reuse-secret-scan

# Workflow riusabile: secret scan su tutta la storia (gitleaks).
# Caller: uses: XtremeAlex/.github/.github/workflows/reuse-secret-scan.yml@main
on:
  workflow_call:

jobs:
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_ENABLE_SUMMARY: "true"
